version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: loan_system_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loans_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    image: node:20-alpine
    container_name: loan_system_server
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/loans_db?schema=public
      - JWT_SECRET=your_super_secret_jwt_key_change_me_in_production
      - PORT=3000
    command: >
      sh -c "npm install && 
             npx prisma generate && 
             npx prisma db push && 
             npm run dev"
    restart: unless-stopped

  client:
    image: node:20-alpine
    container_name: loan_system_client
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:3000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  pgdata:
